name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  links:
    name: check-links — битые внутренние ссылки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-links.mjs

  slop:
    name: check-slop — заглушки в текстах
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-slop.py
